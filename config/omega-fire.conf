; ============================================================================
; Omega-Fire — Configuration utilisateur (ressources personnalisées)
; ============================================================================
; Ce fichier permet de déclarer des ressources que le scanner automatique
; ne peut pas détecter tout seul (services non standards, ports internes,
; logs d'applications tierces, etc.). Rien n'est obligatoire : chaque
; section peut être laissée vide ou entièrement supprimée si non utilisée.
;
; Format : une ligne "clé = valeur", plusieurs valeurs séparées par des
; virgules. Les lignes commençant par ';' sont des commentaires, ignorées.
;
; Emplacement de ce fichier (ne pas déplacer) :
;   config/omega-fire.conf
;
; Après modification de ce fichier : relancer un scan via le menu
; 1.3 (Re-scanner le système) ou 7.4 (Recharger la configuration) pour
; que les changements soient pris en compte, sans redémarrer l'application.
; ============================================================================
; ===== LOGS ====
; ============================================================================

[logs]
; Chemins de fichiers de log supplémentaires à surveiller, en plus de ceux
; qu'Omega-Fire gère déjà nativement (var/logs/app.log, audit.log).
; Utile pour un serveur web, une application tierce, un service custom.
;
; Exemple :
; extra_paths = /var/log/nginx/access.log, /var/log/myapp/error.log

extra_paths =

; ============================================================================
; ===== SERVERS WEB ====
; ============================================================================
[web_servers]
; Noms de processus de serveurs web ou applicatifs à détecter via pgrep.
; Le nom doit correspondre exactement à ce qu'affiche 'ps aux' ou 'pgrep -f'.
;
; Exemple :
; custom = nginx, caddy, gunicorn

custom =

; ============================================================================
; ===== MONITORING ====
; ============================================================================
[monitoring]
; Ports TCP supplémentaires à surveiller comme "actifs" (test de connexion
; locale sur 127.0.0.1). Utile pour un dashboard, une API interne, un
; service de supervision maison.
;
; Exemple :
; extra_ports = 8080, 9090, 3000

extra_ports =

; ============================================================================
; ===== BACKENDS ====
; ============================================================================

[backends]
; Backends firewall personnalisés, au-delà de nftables/iptables/fail2ban
; déjà gérés nativement par Omega-Fire. Rarement utile — laisser vide
; sauf cas d'usage avancé.
;
; Exemple :
; custom = mon-backend-custom

custom =

; ============================================================================
